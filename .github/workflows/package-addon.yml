name: Package B2 Add-on

on:
  push:
    branches:
      - b2-tntcoin-integration
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bedrock files
        shell: bash
        run: |
          test -f B2Addon/manifest.json
          test -f B2Addon/scripts/main.js
          python3 - <<'PY'
          import json
          with open('B2Addon/manifest.json', encoding='utf-8') as f:
              json.load(f)
          print('manifest.json OK')
          PY

      - name: Build mcpack and mcaddon
        shell: bash
        run: |
          rm -rf build B2Addon.mcpack B2Addon.mcaddon
          mkdir -p build/B2Addon
          cp -R B2Addon/. build/B2Addon/

          # The .mcpack must contain manifest.json at its root.
          cd build/B2Addon
          zip -r ../../B2Addon.mcpack .
          cd ../..

          # The .mcaddon is a ZIP whose package files are at the archive root.
          zip -j B2Addon.mcaddon B2Addon.mcpack

      - name: Validate mcaddon structure
        shell: bash
        run: |
          unzip -t B2Addon.mcaddon
          test "$(unzip -Z1 B2Addon.mcaddon | grep -c '^B2Addon\.mcpack$')" -eq 1
          unzip -p B2Addon.mcaddon B2Addon.mcpack > build/test.mcpack
          unzip -t build/test.mcpack
          unzip -l build/test.mcpack | grep -q 'manifest.json'

      - name: Upload mcaddon
        uses: actions/upload-artifact@v4
        with:
          name: B2Addon-mcaddon
          path: B2Addon.mcaddon
