name: Package B2 Add-on

on:
  push:
    branches:
      - b2-tntcoin-integration
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create mcaddon
        run: |
          cd B2Addon
          zip -r ../B2Addon.mcaddon .
      - name: Upload mcaddon
        uses: actions/upload-artifact@v4
        with:
          name: B2Addon-mcaddon
          path: B2Addon.mcaddon
