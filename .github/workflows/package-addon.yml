name: Package B2 Add-on

on:
  push:
    branches:
      - b2-tntcoin-integration
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Bedrock files
        shell: bash
        run: |
          test -f B2Addon/manifest.json
          test -f B2Addon/scripts/main.js
          python3 - <<'PY'
          import json
          with open('B2Addon/manifest.json', encoding='utf-8') as f:
              json.load(f)
          print('manifest.json OK')
          PY
      - name: Build mcaddon
        shell: bash
        run: |
          rm -rf build
          mkdir -p build/B2Addon
          cp -R B2Addon/. build/B2Addon/
          cd build/B2Addon
          zip -r ../B2Addon.mcpack .
          cd ../..
          zip -r B2Addon.mcaddon build/B2Addon.mcpack
      - name: Validate archive
        shell: bash
        run: |
          unzip -t B2Addon.mcaddon
          unzip -p B2Addon.mcaddon build/B2Addon.mcpack > /dev/null
      - name: Upload mcaddon
        uses: actions/upload-artifact@v4
        with:
          name: B2Addon-mcaddon
          path: B2Addon.mcaddon
